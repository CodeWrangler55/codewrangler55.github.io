<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Capacity Conversion War Room</title>
    <link rel="stylesheet" href="/assets/base.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="topbar">
      <div><strong>AI Capacity Conversion War Room</strong><span>Turn saved minutes into an operating decision</span></div>
    </header>
    <main class="war-room">
      <section class="scenario-panel">
        <h1>Will AI actually move the queue?</h1>
        <p>Choose an operating scenario, adjust the assumptions, and generate an executive capacity plan that says where the gain goes.</p>
        <select id="scenario">
          <option value="support">Customer support escalation queue</option>
          <option value="finance">Finance invoice exception queue</option>
          <option value="onboarding">Customer onboarding review queue</option>
        </select>
        <div class="inputs">
          <label>Demand per hour<input id="demandPerHour" type="number" value="30"></label>
          <label>Staff assigned<input id="agents" type="number" value="3"></label>
          <label>Minutes per case<input id="minutesPerCase" type="number" value="12"></label>
          <label>AI assist percent<input id="aiAssistPercent" type="number" value="30"></label>
          <label>Review burden percent<input id="reviewPercent" type="number" value="20"></label>
          <label>Operating hours<input id="hours" type="number" value="8"></label>
        </div>
        <button id="run">Generate capacity plan</button>
      </section>
      <section class="plan-panel">
        <div class="war-map">
          <article><span>Baseline backlog</span><strong id="base-backlog"></strong></article>
          <article><span>AI backlog</span><strong id="ai-backlog"></strong></article>
          <article><span>Cases completed</span><strong id="completed"></strong></article>
          <article><span>Utilization</span><strong id="utilization"></strong></article>
        </div>
        <section class="recommendation">
          <h2 id="scenario-title"></h2>
          <p id="recommendation"></p>
          <ol id="plan"></ol>
        </section>
      </section>
    </main>
    <script type="module">
      import { buildCapacityPlan } from "/assets/project-logic.mjs";

      const scenarioNames = {
        support: "Customer support escalation queue",
        finance: "Finance invoice exception queue",
        onboarding: "Customer onboarding review queue"
      };

      const presets = {
        support: { demandPerHour: 30, agents: 3, minutesPerCase: 12, aiAssistPercent: 30, reviewPercent: 20, hours: 8 },
        finance: { demandPerHour: 16, agents: 4, minutesPerCase: 18, aiAssistPercent: 42, reviewPercent: 18, hours: 8 },
        onboarding: { demandPerHour: 11, agents: 3, minutesPerCase: 24, aiAssistPercent: 35, reviewPercent: 25, hours: 8 }
      };

      function setPreset(name) {
        for (const [key, value] of Object.entries(presets[name])) document.querySelector(`#${key}`).value = value;
      }

      function render() {
        const input = Object.fromEntries(["demandPerHour", "agents", "minutesPerCase", "aiAssistPercent", "reviewPercent", "hours"].map((id) => [id, Number(document.querySelector(`#${id}`).value)]));
        const plan = buildCapacityPlan(input);
        document.querySelector("#scenario-title").textContent = scenarioNames[document.querySelector("#scenario").value];
        document.querySelector("#base-backlog").textContent = plan.current.backlog;
        document.querySelector("#ai-backlog").textContent = plan.assisted.backlog;
        document.querySelector("#completed").textContent = plan.assisted.completions;
        document.querySelector("#utilization").textContent = `${plan.assisted.utilization}%`;
        document.querySelector("#recommendation").textContent = plan.recommendation;
        document.querySelector("#plan").innerHTML = plan.executivePlan.map((item) => `<li>${item}</li>`).join("");
      }

      document.querySelector("#scenario").addEventListener("change", (event) => {
        setPreset(event.target.value);
        render();
      });
      document.querySelector("#run").addEventListener("click", render);
      render();
    </script>
  </body>
</html>
